<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Login - Messenger App</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');
    body { background: linear-gradient(135deg, #f09433 0%, #e6683c 50%, #dc2743 75%, #cc2366 100%); display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'Poppins', sans-serif; margin: 0; }
    .auth-card { background: rgba(255, 255, 255, 0.25); backdrop-filter: blur(15px); border-radius: 30px; padding: 40px; width: 380px; box-shadow: 0 12px 30px rgba(0,0,0,0.2); text-align: center; border: 1px solid rgba(255,255,255,0.1); }
    h2 { font-weight: 600; margin-bottom: 30px; color: #fff; }
    .form-group { margin-bottom: 25px; text-align: left; }
    label { font-weight: 500; font-size: 14px; margin-bottom: 8px; display: block; color: #fff; }
    input { width: 100%; padding: 14px 18px; border-radius: 12px; border: none; background: rgba(255, 255, 255, 0.5); color: #311b3a; font-size: 16px; }
    button { width: 100%; background: #fff; border-radius: 12px; padding: 14px; font-weight: 700; font-size: 16px; color: #dc2743; border: none; cursor: pointer; margin-top: 10px; transition: transform 0.2s; }
    button:hover { transform: scale(1.03); }
    .switch-link { margin-top: 25px; font-size: 14px; color: #eee; }
    .switch-link a { color: #fff; font-weight: 600; text-decoration: none; }
    .flash.error { padding: 12px; margin-bottom: 20px; border-radius: 12px; background: rgba(231, 76, 60, 0.85); color: #fff; }
  </style>
</head>
<body>
  <div class="auth-card">
    <h2>Welcome Back</h2>
    {% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}{% if category == 'error' %}<div class="flash error">{{ message }}</div>{% endif %}{% endfor %}{% endwith %}
    <form method="POST">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" required />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required />
      </div>
      <button type="submit">Sign In</button>
    </form>
    <div class="switch-link">Don't have an account? <a href="{{ url_for('register') }}">Create one</a></div>
  </div>
</body>
</html>
